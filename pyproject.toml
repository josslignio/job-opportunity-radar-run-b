[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-opportunity-radar"
version = "0.1.0"
description = "Explainable daily job opportunity radar for JOSS"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
job-radar = "job_radar.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
